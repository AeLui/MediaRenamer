# ---------------------------------------------------------------- setup wizard
wizard.title=Welcome to MediaRenamer
wizard.subtitle=Let's set up a few things. Everything is optional and can be changed later in Preferences.
wizard.step.language=Language
wizard.step.services=Data services
wizard.step.servers=Media servers
wizard.language.title=Choose the interface language
wizard.language.text=It is used for menus, dialogs and messages. The language of titles and overviews (data language) is chosen when fetching data.
wizard.services.title=Connect to the data services
wizard.services.text=Each service needs your own free API key (MediaRenamer does not include any). Hover over the info icon to see what each one is for and use <b>Get</b> to request a key. All are optional: <b>ID3 tags</b> (music) work without a key.
wizard.servers.title=Connect your media servers (optional)
wizard.servers.text=If you use Jellyfin or Plex, MediaRenamer can ask them to scan their libraries after each rename so that the new files appear right away. Leave it empty if you do not use them.
wizard.back=Back
wizard.next=Next
wizard.finish=Finish
wizard.skip=Skip setup
wizard.skip.tooltip=Start with the default settings (you can configure everything later in Preferences)
service.info.tmdb=<b>TheMovieDB</b>: data of movies and series (titles in many languages, year, posters, episodes, genres, cast). The recommended main source for movies and series.
service.info.tvdb=<b>TheTVDB</b>: episode lists of series, with alternative orders (DVD, absolute, digital…). Useful for anime and for series whose order differs between sources.
service.info.tvdbPin=Only needed if your TheTVDB key is a subscriber (user-supported) key. Leave it empty otherwise.
service.info.acoustid=<b>AcoustID</b>: identifies music files by their acoustic fingerprint, even without tags (needs fpcalc from Chromaprint).
service.info.anidb=<b>AniDB</b>: anime episode lists with absolute numbering. Register an HTTP client at AniDB and enter its name here.
service.info.anidbVersion=Version of the HTTP client registered at AniDB (usually 1).

