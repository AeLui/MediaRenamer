info.plex.scan=After moving the files, ask Plex to scan all its libraries so that they appear right away. A profile can change this. Needs the URL and the token.
info.mediainfo=MediaInfo reads the technical data of video and audio files ({vf}, {vc}, {ac}, HDR…) and the music tags. Empty = it is searched automatically (MediaInfo installation).
info.fpcalc=fpcalc (Chromaprint) computes the acoustic fingerprint that AcoustID needs to identify music. Empty = it is searched automatically.

# ---------------------------------------------------------------- CLI help
cli.usage=MediaRenamer - renames series, movies and music\n\
\n\
Usage:\n\
\  MediaRenamer                         opens the graphical interface\n\
\  MediaRenamer -rename <paths...> [options]\n\
\  MediaRenamer -list --db <db> --q <series> [--format f] [--order o] [--lang l]\n\
\  MediaRenamer -mediainfo <file> [--format f]\n\
\  MediaRenamer -history\n\
\  MediaRenamer -profiles                lists the profiles\n\
\n\
-rename options:\n\
\  --profile   name of a profile (explicit options take precedence)\n\
\  --db        TheMovieDB | TheMovieDB::TV | TheTVDB | AniDB | AcoustID | ID3 | file\n\
\  --format    format expression, e.g. "{n} - {s00e00} - {t}"\n\
\  --action    move | copy | keeplink | symlink | test                                  (default: move)\n\
\  --conflict  if the target exists: skip | override | best (= auto) | worst | largest | smallest | ask | index | fail\n\
\              best/worst = keep the higher/lower quality one; largest/smallest = the bigger/smaller file;\n\
\              ask = ask every time, showing quality and size                         (default: skip)\n\
\  --lang      data language, e.g. es-ES, en, de                                      (default: the system's)\n\
\  --order     Airdate | DVD | Absolute | Digital | Story | Production | Date            (default: Airdate)\n\
\  --q         forced query (series name or "Movie (Year)")\n\
\  --output    target folder (target = folder/format); precedence: --output > profile > Preferences > the file's folder\n\
\  -r          recurse into subfolders\n\
\  -non-strict opportunistic matching (default: strict)\n\
\  -clean      apply the suggested cleanup to problematic names (invalid characters, reserved names, length...)\n\
\  -debug      detailed logging\n\
\n\
Messages use the interface language (Preferences > Interface language; otherwise the system's).

