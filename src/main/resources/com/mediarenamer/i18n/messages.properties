info.folder.music=Default folder for renamed music files.
info.folder.other=Default folder for files renamed in File mode (without data from a service).
info.jellyfin.url=Address of your Jellyfin server, e.g. http://192.168.1.10:8096. With the URL written, "Get" opens its API keys page.
info.jellyfin.key=API Key created in Jellyfin (Dashboard → API Keys → +). It is stored encrypted and is only sent to your server.
info.jellyfin.scan=After moving the files, ask Jellyfin to scan all its libraries so that they appear right away. A profile can change this. Needs the URL and the API Key.
