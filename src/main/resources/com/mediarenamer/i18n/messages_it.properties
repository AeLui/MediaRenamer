# ---------------------------------------------------------------- setup wizard
wizard.title=Benvenuto in MediaRenamer
wizard.subtitle=Configuriamo alcune cose. Tutto è facoltativo e si può cambiare in seguito nelle Preferenze.
wizard.step.language=Lingua
wizard.step.services=Servizi di dati
wizard.step.servers=Server multimediali
wizard.language.title=Scegli la lingua dell'interfaccia
wizard.language.text=Viene usata per menu, finestre di dialogo e messaggi. La lingua di titoli e trame (lingua dei dati) si sceglie durante la ricerca dei dati.
wizard.services.title=Collegati ai servizi di dati
wizard.services.text=Ogni servizio richiede una tua chiave API gratuita (MediaRenamer non ne include nessuna). Passa il mouse sull'icona informazioni per vedere a cosa serve ciascuno e usa <b>Ottieni</b> per richiedere una chiave. Sono tutti facoltativi: i <b>tag ID3</b> (musica) funzionano senza chiave.
wizard.servers.title=Collega i tuoi server multimediali (facoltativo)
wizard.servers.text=Se usi Jellyfin o Plex, MediaRenamer può chiedere loro di scansionare le librerie dopo ogni rinomina, così i nuovi file compaiono subito. Lascia vuoto se non li usi.
wizard.back=Indietro
wizard.next=Avanti
wizard.finish=Fine
wizard.skip=Salta la configurazione
wizard.skip.tooltip=Inizia con le impostazioni predefinite (puoi configurare tutto in seguito nelle Preferenze)
service.info.tmdb=<b>TheMovieDB</b>: dati di film e serie (titoli in molte lingue, anno, locandine, episodi, generi, cast). La fonte principale consigliata per film e serie.
service.info.tvdb=<b>TheTVDB</b>: elenchi di episodi delle serie, con ordini alternativi (DVD, assoluto, digitale…). Utile per gli anime e per le serie il cui ordine cambia secondo la fonte.
service.info.tvdbPin=Serve solo se la tua chiave TheTVDB è di un abbonato (user-supported). Altrimenti lascia vuoto.
service.info.acoustid=<b>AcoustID</b>: identifica i file musicali dalla loro impronta acustica, anche senza tag (richiede fpcalc di Chromaprint).
service.info.anidb=<b>AniDB</b>: elenchi di episodi anime con numerazione assoluta. Registra un client HTTP su AniDB e inseriscine qui il nome.
service.info.anidbVersion=Versione del client HTTP registrato su AniDB (di solito 1).

