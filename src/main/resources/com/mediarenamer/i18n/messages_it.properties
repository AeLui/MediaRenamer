# ---------------------------------------------------------------- CLI help
cli.usage=MediaRenamer - rinomina serie, film e musica\n\
\n\
Uso:\n\
\  MediaRenamer                         apre l'interfaccia grafica\n\
\  MediaRenamer -rename <percorsi...> [opzioni]\n\
\  MediaRenamer -list --db <db> --q <serie> [--format f] [--order o] [--lang l]\n\
\  MediaRenamer -mediainfo <file> [--format f]\n\
\  MediaRenamer -history\n\
\  MediaRenamer -profiles                elenca i profili\n\
\n\
Opzioni di -rename:\n\
\  --profile   nome di un profilo (le opzioni esplicite hanno la precedenza)\n\
\  --db        TheMovieDB | TheMovieDB::TV | TheTVDB | AniDB | AcoustID | ID3 | file\n\
\  --format    espressione di formato, ad es. "{n} - {s00e00} - {t}"\n\
\  --action    move | copy | keeplink | symlink | test                                  (predefinito: move)\n\
\  --conflict  se la destinazione esiste: skip | override | best (= auto) | worst | largest | smallest | ask | index | fail\n\
\              best/worst = tenere quello di qualità maggiore/minore; largest/smallest = il più pesante/leggero;\n\
\              ask = chiedere ogni volta mostrando qualità e dimensione                (predefinito: skip)\n\
\  --lang      lingua dei dati, ad es. es-ES, en, de                                  (predefinito: quella del sistema)\n\
\  --order     Airdate | DVD | Absolute | Digital | Story | Production | Date            (predefinito: Airdate)\n\
\  --q         ricerca forzata (nome della serie o "Film (Anno)")\n\
\  --output    cartella di destinazione (destinazione = cartella/formato); precedenza: --output > profilo > Preferenze > cartella del file\n\
\  -r          includere le sottocartelle\n\
\  -non-strict abbinamento opportunistico (predefinito: rigoroso)\n\
\  -clean      applicare la pulizia proposta ai nomi con problemi (caratteri non validi, nomi riservati, lunghezza...)\n\
\  -debug      registro dettagliato\n\
\n\
I messaggi usano la lingua dell'interfaccia (Preferenze > Lingua dell'interfaccia; altrimenti quella del sistema).

