wizard.jellyfin.text=Si vous utilisez un serveur multimédia Jellyfin, MediaRenamer peut lui demander d'analyser ses bibliothèques après chaque renommage pour que les nouveaux fichiers apparaissent tout de suite. Laissez vide si vous n'utilisez pas Jellyfin.
