info.uiLanguage=Langue des menus, boîtes de dialogue et messages, ainsi que de la ligne de commande. Automatique = la langue du système (anglais si elle n'est pas disponible).
info.theme=Apparence claire ou sombre. Elle peut aussi être changée avec le bouton lune/soleil en haut à droite.
info.dataLanguage=Langue des titres, résumés et noms d'épisodes téléchargés depuis les services de données (p. ex. es-ES, en-US). Vide = la langue du système.
info.folder.movies=Dossier par défaut des films renommés. Le format est placé à l'intérieur (p. ex. Films/Avatar (2009).mkv). Vide = le fichier reste dans son dossier.
info.folder.series=Dossier par défaut des épisodes de séries renommés. Le format peut ajouter des sous-dossiers par série et saison.
info.folder.anime=Dossier par défaut des animes identifiés avec AniDB. Vide = le dossier Séries est utilisé.
info.folder.music=Dossier par défaut des fichiers musicaux renommés.
info.folder.other=Dossier par défaut des fichiers renommés en mode Fichier (sans données d'un service).
info.jellyfin.url=Adresse de votre serveur Jellyfin, p. ex. http://192.168.1.10:8096. Une fois l'URL saisie, «Obtenir» ouvre sa page des clés d'API.
info.jellyfin.key=Clé d'API créée dans Jellyfin (Tableau de bord → Clés API → +). Elle est stockée chiffrée et n'est envoyée qu'à votre serveur.
info.jellyfin.scan=Après le déplacement des fichiers, demande à Jellyfin d'analyser toutes ses bibliothèques pour qu'ils apparaissent tout de suite. Un profil peut le modifier. Nécessite l'URL et la clé d'API.
info.mediainfo=MediaInfo lit les données techniques des fichiers vidéo et audio ({vf}, {vc}, {ac}, HDR…) et les tags musicaux. Vide = recherche automatique (installation de MediaInfo).
info.fpcalc=fpcalc (Chromaprint) calcule l'empreinte acoustique dont AcoustID a besoin pour identifier la musique. Vide = recherche automatique.

# ---------------------------------------------------------------- CLI help
cli.usage=MediaRenamer - renomme séries, films et musique\n\
\n\
Utilisation :\n\
\  MediaRenamer                         ouvre l'interface graphique\n\
\  MediaRenamer -rename <chemins...> [options]\n\
\  MediaRenamer -list --db <db> --q <série> [--format f] [--order o] [--lang l]\n\
\  MediaRenamer -mediainfo <fichier> [--format f]\n\
\  MediaRenamer -history\n\
\  MediaRenamer -profiles                liste les profils\n\
\n\
Options de -rename :\n\
\  --profile   nom d'un profil (les options explicites sont prioritaires)\n\
\  --db        TheMovieDB | TheMovieDB::TV | TheTVDB | AniDB | OMDb | AcoustID | ID3 | file\n\
\  --format    expression de format, p. ex. "{n} - {s00e00} - {t}"\n\
\  --action    move | copy | keeplink | symlink | test                                  (par défaut : move)\n\
\  --conflict  si la destination existe : skip | override | best (= auto) | worst | largest | smallest | ask | index | fail\n\
\              best/worst = garder celui de meilleure/moins bonne qualité ; largest/smallest = le plus lourd/léger ;\n\
\              ask = demander à chaque fois en montrant qualité et taille             (par défaut : skip)\n\
\  --lang      langue des données, p. ex. es-ES, en, de                               (par défaut : celle du système)\n\
\  --order     Airdate | DVD | Absolute | Digital | Story | Production | Date            (par défaut : Airdate)\n\
\  --q         requête forcée (nom de la série ou "Film (Année)")\n\
\  --output    dossier de destination (destination = dossier/format) ; priorité : --output > profil > Préférences > dossier du fichier\n\
\  -r          parcourir les sous-dossiers\n\
\  -non-strict correspondance opportuniste (par défaut : stricte)\n\
\  -clean      appliquer le nettoyage proposé aux noms problématiques (caractères non valides, noms réservés, longueur...)\n\
\  -debug      journal détaillé\n\
\n\
Les messages utilisent la langue de l'interface (Préférences > Langue de l'interface ; sinon celle du système).
