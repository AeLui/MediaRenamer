wizard.services.text=Chaque service nécessite votre propre clé d'API gratuite (MediaRenamer n'en inclut aucune). Survolez l'icône d'information pour voir à quoi sert chacun et utilisez <b>Obtenir</b> pour demander une clé. Tous sont facultatifs : les <b>tags ID3</b> (musique) fonctionnent sans clé.
