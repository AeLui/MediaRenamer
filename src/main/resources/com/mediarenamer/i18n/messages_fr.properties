service.info.tmdb=<b>TheMovieDB</b> : données de films et de séries (titres dans de nombreuses langues, année, affiches, épisodes, genres, distribution). La source principale recommandée pour les films et les séries.
service.info.tvdb=<b>TheTVDB</b> : listes d'épisodes de séries, avec des ordres alternatifs (DVD, absolu, numérique…). Utile pour l'anime et les séries dont l'ordre varie selon la source.
service.info.tvdbPin=Nécessaire uniquement si votre clé TheTVDB est une clé d'abonné (user-supported). Sinon, laissez vide.
service.info.omdb=<b>OMDb</b> : données de films d'IMDb (note et votes IMDb, réalisateur, distribution). Source de films alternative et variable de format {omdb}.
service.info.acoustid=<b>AcoustID</b> : identifie les fichiers musicaux par leur empreinte acoustique, même sans tags (nécessite fpcalc de Chromaprint).
service.info.anidb=<b>AniDB</b> : listes d'épisodes d'anime avec numérotation absolue. Enregistrez un client HTTP sur AniDB et saisissez son nom ici.
service.info.anidbVersion=Version du client HTTP enregistré sur AniDB (généralement 1).

