# ---------------------------------------------------------------- setup wizard
wizard.title=Bem-vindo ao MediaRenamer
wizard.subtitle=Vamos configurar algumas coisas. Tudo é opcional e pode ser alterado depois nas Preferências.
wizard.step.language=Idioma
wizard.step.services=Serviços de dados
wizard.step.servers=Servidores multimédia
wizard.language.title=Escolha o idioma da interface
wizard.language.text=É usado nos menus, caixas de diálogo e mensagens. O idioma dos títulos e sinopses (idioma dos dados) escolhe-se ao procurar os dados.
wizard.services.title=Ligue-se aos serviços de dados
wizard.services.text=Cada serviço precisa da sua própria chave de API gratuita (o MediaRenamer não inclui nenhuma). Passe o rato pelo ícone de informação para ver para que serve cada um e use <b>Obter</b> para pedir uma chave. Todos são opcionais: as <b>etiquetas ID3</b> (música) funcionam sem chave.
wizard.servers.title=Ligue os seus servidores multimédia (opcional)
wizard.servers.text=Se usa o Jellyfin ou o Plex, o MediaRenamer pode pedir-lhes que analisem as bibliotecas depois de cada mudança de nome, para que os novos ficheiros apareçam de imediato. Deixe vazio se não os usa.
wizard.back=Anterior
wizard.next=Seguinte
wizard.finish=Concluir
wizard.skip=Ignorar a configuração
wizard.skip.tooltip=Começar com as definições predefinidas (pode configurar tudo depois nas Preferências)
service.info.tmdb=<b>TheMovieDB</b>: dados de filmes e séries (títulos em muitos idiomas, ano, capas, episódios, géneros, elenco). A fonte principal recomendada para filmes e séries.
service.info.tvdb=<b>TheTVDB</b>: listas de episódios de séries, com ordens alternativas (DVD, absoluta, digital…). Útil para anime e para séries cuja ordem muda consoante a fonte.
service.info.tvdbPin=Só é necessário se a sua chave do TheTVDB for de subscritor (user-supported). Caso contrário, deixe vazio.
service.info.acoustid=<b>AcoustID</b>: identifica ficheiros de música pela sua impressão acústica, mesmo sem etiquetas (precisa do fpcalc do Chromaprint).
service.info.anidb=<b>AniDB</b>: listas de episódios de anime com numeração absoluta. Registe um cliente HTTP no AniDB e escreva aqui o seu nome.
service.info.anidbVersion=Versão do cliente HTTP registado no AniDB (normalmente 1).

