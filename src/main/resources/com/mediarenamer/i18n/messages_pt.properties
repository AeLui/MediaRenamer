info.mediainfo=O MediaInfo lê os dados técnicos dos ficheiros de vídeo e áudio ({vf}, {vc}, {ac}, HDR…) e as etiquetas de música. Vazio = é procurado automaticamente (instalação do MediaInfo).
info.fpcalc=O fpcalc (Chromaprint) calcula a impressão acústica de que o AcoustID precisa para identificar música. Vazio = é procurado automaticamente.

# ---------------------------------------------------------------- CLI help
cli.usage=MediaRenamer - muda o nome de séries, filmes e música\n\
\n\
Utilização:\n\
\  MediaRenamer                         abre a interface gráfica\n\
\  MediaRenamer -rename <caminhos...> [opções]\n\
\  MediaRenamer -list --db <db> --q <série> [--format f] [--order o] [--lang l]\n\
\  MediaRenamer -mediainfo <ficheiro> [--format f]\n\
\  MediaRenamer -history\n\
\  MediaRenamer -profiles                lista os perfis\n\
\n\
Opções de -rename:\n\
\  --profile   nome de um perfil (as opções explícitas têm prioridade)\n\
\  --db        TheMovieDB | TheMovieDB::TV | TheTVDB | AniDB | AcoustID | ID3 | file\n\
\  --format    expressão de formato, p. ex. "{n} - {s00e00} - {t}"\n\
\  --action    move | copy | keeplink | symlink | test                                  (predefinido: move)\n\
\  --conflict  se o destino existir: skip | override | best (= auto) | worst | largest | smallest | ask | index | fail\n\
\              best/worst = manter o de maior/menor qualidade; largest/smallest = o mais pesado/leve;\n\
\              ask = perguntar em cada caso mostrando qualidade e tamanho             (predefinido: skip)\n\
\  --lang      idioma dos dados, p. ex. es-ES, en, de                                 (predefinido: o do sistema)\n\
\  --order     Airdate | DVD | Absolute | Digital | Story | Production | Date            (predefinido: Airdate)\n\
\  --q         pesquisa forçada (nome da série ou "Filme (Ano)")\n\
\  --output    pasta de destino (destino = pasta/formato); prioridade: --output > perfil > Preferências > pasta do ficheiro\n\
\  -r          percorrer subpastas\n\
\  -non-strict correspondência oportunista (predefinido: estrita)\n\
\  -clean      aplicar a limpeza proposta aos nomes com problemas (caracteres inválidos, nomes reservados, comprimento...)\n\
\  -debug      registo detalhado\n\
\n\
As mensagens usam o idioma da interface (Preferências > Idioma da interface; caso contrário, o do sistema).

