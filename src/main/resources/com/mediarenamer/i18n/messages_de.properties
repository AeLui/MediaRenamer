# ---------------------------------------------------------------- CLI help
cli.usage=MediaRenamer - benennt Serien, Filme und Musik um\n\
\n\
Verwendung:\n\
\  MediaRenamer                         öffnet die grafische Oberfläche\n\
\  MediaRenamer -rename <Pfade...> [Optionen]\n\
\  MediaRenamer -list --db <db> --q <Serie> [--format f] [--order o] [--lang l]\n\
\  MediaRenamer -mediainfo <Datei> [--format f]\n\
\  MediaRenamer -history\n\
\  MediaRenamer -profiles                listet die Profile auf\n\
\n\
Optionen von -rename:\n\
\  --profile   Name eines Profils (ausdrücklich angegebene Optionen haben Vorrang)\n\
\  --db        TheMovieDB | TheMovieDB::TV | TheTVDB | AniDB | AcoustID | ID3 | file\n\
\  --format    Formatausdruck, z. B. "{n} - {s00e00} - {t}"\n\
\  --action    move | copy | keeplink | symlink | test                                  (Standard: move)\n\
\  --conflict  wenn das Ziel existiert: skip | override | best (= auto) | worst | largest | smallest | ask | index | fail\n\
\              best/worst = die mit höherer/niedrigerer Qualität behalten; largest/smallest = die größere/kleinere Datei;\n\
\              ask = jedes Mal fragen, mit Qualität und Größe                          (Standard: skip)\n\
\  --lang      Sprache der Daten, z. B. es-ES, en, de                                 (Standard: die des Systems)\n\
\  --order     Airdate | DVD | Absolute | Digital | Story | Production | Date            (Standard: Airdate)\n\
\  --q         erzwungene Suche (Serienname oder "Film (Jahr)")\n\
\  --output    Zielordner (Ziel = Ordner/Format); Vorrang: --output > Profil > Einstellungen > Ordner der Datei\n\
\  -r          Unterordner einbeziehen\n\
\  -non-strict opportunistische Zuordnung (Standard: strikt)\n\
\  -clean      die vorgeschlagene Bereinigung auf problematische Namen anwenden (ungültige Zeichen, reservierte Namen, Länge...)\n\
\  -debug      ausführliche Protokollierung\n\
\n\
Die Meldungen erscheinen in der Sprache der Oberfläche (Einstellungen > Sprache der Oberfläche; sonst die des Systems).

