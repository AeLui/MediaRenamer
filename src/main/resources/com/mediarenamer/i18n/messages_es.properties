service.info.tmdb=<b>TheMovieDB</b>: datos de películas y series (títulos en muchos idiomas, año, carátulas, episodios, géneros, reparto). La fuente principal recomendada para películas y series.
service.info.tvdb=<b>TheTVDB</b>: listas de episodios de series, con órdenes alternativos (DVD, absoluto, digital…). Útil para anime y para series cuyo orden cambia según la fuente.
service.info.tvdbPin=Solo hace falta si tu clave de TheTVDB es de suscriptor (user-supported). Si no, déjalo vacío.
service.info.acoustid=<b>AcoustID</b>: identifica ficheros de música por su huella acústica, incluso sin etiquetas (necesita fpcalc de Chromaprint).
service.info.anidb=<b>AniDB</b>: listas de episodios de anime con numeración absoluta. Registra un cliente HTTP en AniDB y escribe aquí su nombre.
service.info.anidbVersion=Versión del cliente HTTP registrado en AniDB (normalmente 1).

