# ---------------------------------------------------------------- CLI help
cli.usage=MediaRenamer - renombra series, películas y música\n\
\n\
Uso:\n\
\  MediaRenamer                         abre la interfaz gráfica\n\
\  MediaRenamer -rename <rutas...> [opciones]\n\
\  MediaRenamer -list --db <db> --q <serie> [--format f] [--order o] [--lang l]\n\
\  MediaRenamer -mediainfo <fichero> [--format f]\n\
\  MediaRenamer -history\n\
\  MediaRenamer -profiles                lista los perfiles\n\
\n\
Opciones de -rename:\n\
\  --profile   nombre de un perfil (las opciones explícitas tienen prioridad)\n\
\  --db        TheMovieDB | TheMovieDB::TV | TheTVDB | AniDB | AcoustID | ID3 | file\n\
\  --format    expresión de formato, p.ej. "{n} - {s00e00} - {t}"\n\
\  --action    move | copy | keeplink | symlink | test                                  (por defecto: move)\n\
\  --conflict  si el destino existe: skip | override | best (= auto) | worst | largest | smallest | ask | index | fail\n\
\              best/worst = mantener el de mayor/menor calidad; largest/smallest = el más pesado/ligero;\n\
\              ask = preguntar en cada caso mostrando calidad y tamaño                (por defecto: skip)\n\
\  --lang      idioma de los datos, p.ej. es-ES, en, de                               (por defecto: el del sistema)\n\
\  --order     Airdate | DVD | Absolute | Digital | Story | Production | Date            (por defecto: Airdate)\n\
\  --q         consulta forzada (nombre de serie o "Película (Año)")\n\
\  --output    carpeta de destino (destino = carpeta/formato); prioridad: --output > perfil > Preferencias > carpeta del fichero\n\
\  -r          recorrer subcarpetas\n\
\  -non-strict emparejamiento oportunista (por defecto: estricto)\n\
\  -clean      aplicar la limpieza propuesta a los nombres con problemas (caracteres no válidos, reservados, longitud...)\n\
\  -debug      trazas detalladas\n\
\n\
Los mensajes salen en el idioma de la interfaz (Preferencias > Idioma de la interfaz; si no, el del sistema).

