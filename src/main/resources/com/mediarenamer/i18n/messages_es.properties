wizard.servers.title=Conecta tus servidores multimedia (opcional)
wizard.servers.text=Si usas Jellyfin o Plex, MediaRenamer puede pedirles que escaneen sus bibliotecas después de cada renombrado para que los ficheros nuevos aparezcan enseguida. Déjalo vacío si no los usas.
