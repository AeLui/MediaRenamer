# Builds and tests the Windows executables and the installer and attaches them to the GitHub release of the tag.
# Releases are not code-signed: see docs/RELEASE_INTEGRITY.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          # The bundled runtime is this JDK: THIRD-PARTY-NOTICES.txt describes SapMachine (checked after jpackage)
          distribution: sapmachine
          java-version: '21'
          cache: maven

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pom.xml -Raw)).project.version -replace '-SNAPSHOT$', ''
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME does not match the pom.xml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # The release text is the section of the version in CHANGELOG.md, plus the downloads
      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw),
            "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)").Groups[1].Value.Trim()
          if (-not $section -and $env:GITHUB_REF_TYPE -eq 'tag') {
            throw "CHANGELOG.md has no section for ${version}: rename [Unreleased] to [${version}] before tagging."
          }
          $notes = "$section`n`n## Downloads`n`n" +
                   "- ``MediaRenamer-$version-setup.exe``: Windows installer`n" +
                   "- ``MediaRenamer-$version-windows.zip``: portable, unzip and run ``MediaRenamer.exe```n`n" +
                   "These files are not code-signed: see [Release integrity](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE_INTEGRITY.md)."
          Set-Content -Path release-notes.md -Value $notes.TrimStart() -Encoding utf8

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed" }
          }

      # Maven build with the tests, jpackage, the zip and the installer
      - name: Build
        shell: pwsh
        run: |
          scripts\build-exe.ps1
          $runtime = (Select-String -Path dist\MediaRenamer\runtime\release -Pattern '^JAVA_VERSION="(.*)"').Matches.Groups[1].Value
          if (-not (Select-String -Path THIRD-PARTY-NOTICES.txt -SimpleMatch "SapMachine $runtime" -Quiet)) {
            throw "THIRD-PARTY-NOTICES.txt does not describe the bundled runtime SapMachine ${runtime}: update its Java runtime section."
          }

      - name: Upload the release files
        uses: actions/upload-artifact@v6
        with:
          name: MediaRenamer-${{ steps.version.outputs.version }}
          path: |
            dist/MediaRenamer-${{ steps.version.outputs.version }}-setup.exe
            dist/MediaRenamer-${{ steps.version.outputs.version }}-windows.zip
          if-no-files-found: error

      - name: Attach them to the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = "dist\MediaRenamer-$version-setup.exe", "dist\MediaRenamer-$version-windows.zip"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
            if ($LASTEXITCODE -eq 0) { gh release edit $env:GITHUB_REF_NAME --notes-file release-notes.md }
          } else {
            gh release create $env:GITHUB_REF_NAME @files --title "MediaRenamer $version" --notes-file release-notes.md --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
